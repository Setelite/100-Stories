<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d13">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="100 дней без сценария — личный видеодневник. Темы, идеи для сторис и Reels, прогресс и отметки выполнения.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="100 дней">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>100 дней без сценария · Мой видеодневник</title>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="./icons/icon-192.png" alt="Иконка 100 дней" width="58" height="58">
        <div class="brand-copy"><strong>100 ДНЕЙ</strong><span>БЕЗ СЦЕНАРИЯ</span></div>
      </div>
      <div class="side-description">Твой личный видеодневник.<br>Каждый день — новый повод включить камеру.</div>
      <nav class="nav-main" aria-label="Основные разделы">
        <button data-page="home" class="nav-item active" aria-label="Главная"><span data-icon="home"></span><span>Главная</span></button>
        <button data-page="stories" class="nav-item" aria-label="100 сторис"><span data-icon="grid"></span><span>100 сторис</span></button>
        <button data-page="reels" class="nav-item" aria-label="Reels"><span data-icon="play"></span><span>Reels</span></button>
        <button data-page="stats" class="nav-item" aria-label="Прогресс"><span data-icon="chart"></span><span>Прогресс</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="quick-hint"><span class="quick-hint-dot"></span> Твои данные сохраняются на устройстве</div>
        <button class="plain-button" id="open-settings"><span data-icon="settings"></span> Настройки и копия данных</button>
        <small>Gornostaev · личный проект</small>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      <header class="topbar"><div class="topbar-label" id="topbar-label">МОЙ ВИДЕОДНЕВНИК</div><div class="topbar-right"><span class="date-pill" id="date-pill"></span><button class="icon-btn" id="settings-mobile" title="Настройки" aria-label="Настройки"><span data-icon="settings"></span></button></div></header>
      <section id="page-home" class="page active" aria-label="Сегодня"></section>
      <section id="page-stories" class="page" aria-label="Все сторис"></section>
      <section id="page-reels" class="page" aria-label="Темы Reels"></section>
      <section id="page-stats" class="page" aria-label="Прогресс"></section>
      <footer class="footnote">100 дней без сценария · Начало 26.10.2026 · Время Екатеринбурга</footer>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="Разделы приложения">
    <button data-page="home" class="bottom-item active"><span data-icon="home"></span><span>Сегодня</span></button>
    <button data-page="stories" class="bottom-item"><span data-icon="grid"></span><span>Сторис</span></button>
    <button data-page="reels" class="bottom-item"><span data-icon="play"></span><span>Reels</span></button>
    <button data-page="stats" class="bottom-item"><span data-icon="chart"></span><span>Прогресс</span></button>
  </nav>
  <div id="modal-overlay" class="modal-overlay" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading"><div id="modal-body"></div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
