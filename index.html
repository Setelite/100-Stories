<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ce9cf5;outline-offset:2px}button{border:0}h1,h2,h3,p{margin-top:0}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1320px;min-height:100dvh;margin:auto}.sidebar{position:sticky;top:0;height:100dvh;background:white;border-right:1px solid var(--line);padding:32px 17px;display:flex;flex-direction:column;gap:25px}.logo{display:flex;align-items:center;gap:13px;padding:4px 9px}.logoicon{display:grid;place-items:center;width:49px;height:49px;flex-shrink:0;border-radius:16px;color:white;background:linear-gradient(135deg,#ffd35c 0%,#ff597d 48%,#9549e9 100%);font-size:27px;box-shadow:0 8px 19px #ff4c8d3b}.logo strong{display:block;font-size:19px;letter-spacing:-.7px}.logo small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 17px;border-radius:16px;background:transparent;color:#6e6772;text-align:left;font-weight:750}.nav button.active{background:#fff0f6;color:#df3175}.nav button span{font-size:20px}.side-note{margin-top:auto;padding:16px;background:#fff8fa;border:1px solid #fbe8ef;border-radius:17px;font-size:12px;color:#8b7382;line-height:1.65}.main{padding:38px min(5vw,62px) 105px;min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}.eyebrow{color:#d34182;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:850}.avatar{width:43px;height:43px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ffcf4f,#fd497c,#9b4ff5)}.avatar div{display:grid;place-items:center;background:white;border-radius:50%;width:100%;height:100%;font-weight:850;color:#e74089}.hero{background:linear-gradient(112deg,#fff0ea 0%,#ffe8f4 55%,#f2e9ff 100%);border:1px solid white;border-radius:32px;padding:34px;display:grid;grid-template-columns:1fr auto;gap:16px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;color:#ffffff7e;font-size:165px;right:-27px;top:-70px;pointer-events:none}.hero h1{font-size:clamp(29px,4.3vw,46px);letter-spacing:-1.8px;line-height:1.09;max-width:650px;margin:11px 0 14px}.hero p{color:#776675;font-size:15px;line-height:1.55;margin:0;max-width:530px}.hero-art{width:105px;height:105px;background:#fff9;border:1px solid white;border-radius:32px;display:grid;place-items:center;font-size:62px;transform:rotate(9deg);align-self:center;box-shadow:0 16px 33px #ae528e1c;z-index:1}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;justify-content:center;align-items:center;gap:9px;border-radius:14px;padding:13px 17px;font-weight:800;font-size:14px;transition:transform .15s,opacity .15s}.btn:active{transform:scale(.98)}.primary{color:#fff;background:linear-gradient(100deg,#f95176,#d647a4,#9559ec);box-shadow:0 8px 20px #e84b9633}.secondary{background:#fff;border:1px solid var(--line);color:#655767}.soft{background:#fff0f6;color:#d73579}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:21px;padding:21px;box-shadow:var(--shadow)}.stat small{color:var(--muted);font-weight:700;font-size:12px}.stat strong{display:block;font-size:33px;margin-top:9px;letter-spacing:-1px}.stat em{font-style:normal;font-size:12px;color:#c24988}.section{margin-top:28px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 15px}.sectionhead h2{font-size:23px;letter-spacing:-.65px;margin:0}.progress-card,.panel{background:white;border:1px solid var(--line);border-radius:23px;padding:22px;box-shadow:var(--shadow)}.progress-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;font-size:14px;font-weight:750}.progress-label b{color:#dd3983}.track{background:#f6eaf1;height:13px;overflow:hidden;border-radius:99px}.fill{height:100%;background:linear-gradient(90deg,#ffb35e,#ff5686,#a855eb);border-radius:99px;transition:width .25s}.small-muted{font-size:13px;color:var(--muted);line-height:1.6}.list{display:grid;gap:12px}.task{background:white;border:1px solid var(--line);box-shadow:var(--shadow);padding:17px 18px;display:flex;gap:13px;align-items:flex-start;border-radius:21px}.task.done{background:#fafffd;border-color:#d6f0e5}.tick{height:34px;width:34px;flex:0 0 34px;border:2px solid #ebcedf;border-radius:12px;background:#fff;color:transparent;display:grid;place-items:center;font-size:18px;font-weight:900}.task.done .tick{background:#22b687;border-color:#22b687;color:white}.taskbody{flex:1;min-width:0}.taskmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#b06a9a;font-size:11px;font-weight:800;letter-spacing:.2px;margin-bottom:6px}.tasktitle{font-weight:800;font-size:15px;line-height:1.45;overflow-wrap:anywhere}.task.done .tasktitle{text-decoration:line-through;color:#9c9ba0}.taskdesc{margin-top:8px;color:#817885;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.iconbtn{height:32px;min-width:32px;padding:0 8px;background:#fff2f7;color:#bf4f86;border-radius:10px;font-size:17px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}.field{border:1px solid #eadde5;border-radius:13px;background:white;padding:13px 14px;min-width:0;color:var(--ink)}.toolbar input{flex:1;min-width:155px}.toolbar select{min-width:130px}.chip{font-size:12px;color:#a25d8f;font-weight:750;background:#fff0f7;padding:5px 9px;border-radius:99px}.empty{text-align:center;padding:42px 18px;color:var(--muted);background:white;border:1px dashed #eed5e5;border-radius:20px}.empty b{display:block;color:var(--ink);margin-bottom:8px}.subnav{display:flex;flex-wrap:wrap;gap:8px}.subnav button{border-radius:99px;padding:9px 14px;background:white;border:1px solid var(--line);color:#847386;font-weight:750}.subnav button.active{background:#ffeff6;border-color:#f6c9db;color:#d23b80}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#26152888;display:grid;place-items:center;padding:16px;z-index:20}.modal{background:white;border-radius:25px;width:min(100%,600px);max-height:min(88dvh,850px);overflow-y:auto;padding:27px;box-shadow:0 30px 90px #130b2433}.modal h2{margin-bottom:8px;letter-spacing:-.6px}.modal textarea{display:block;width:100%;min-height:240px;resize:vertical;line-height:1.65}.modal input{width:100%;margin-bottom:12px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.modal-head button{font-size:25px;background:#f8eff5;border-radius:12px;width:36px;height:36px}.hint{padding:13px;background:#fff7ef;border-radius:13px;font-size:12px;color:#926f55;line-height:1.6;margin:13px 0}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#312335;color:#fff;border-radius:13px;padding:13px 18px;box-shadow:0 15px 30px #27172e44;z-index:50;font-size:13px}.bottom{display:none}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}.settings-row b{font-size:14px}.settings-row p{font-size:12px;color:var(--muted);margin:5px 0 0}.settings-row .btn{flex-shrink:0}.footer{margin-top:36px;text-align:center;font-size:12px;color:#ad9eab}

<div class="shell"><aside class="sidebar"><div class="logo"><div class="logoicon">◎</div><div><strong>В КАДРЕ</strong><small>Твой контент-трекер</small></div></div><nav class="nav" id="desktopnav"></nav><div class="side-note">♡ Прогресс хранится на этом устройстве. Сохраняй резервную копию в настройках.</div></aside><main class="main"><div class="topline"><div class="eyebrow">Твой момент сиять ✨</div><div class="avatar"><div>◎</div></div></div><div id="content"></div><div class="footer">В кадре · Сделано для тех, кто решился быть собой ♡</div></main></div><nav class="bottom" id="mobilenav" aria-label="Навигация"></nav><div id="overlay"></div><div id="toaster" aria-live="polite"></div><script src="./data.js"></script>
<script>
(function(){
"use strict";
var KEY="vkadre_v2",OLD="gornostaev100_v1",current="home",filter="all",query="",editId=null;
var defaults=(window.CHALLENGE_DATA&&window.CHALLENGE_DATA.stories||[]).map(function(s,i){return{id:"d"+(i+1),title:s.title,desc:[s.hook,s.talk,s.ending].filter(Boolean).join("\n\n"),done:false,category:s.category||"life"}});
var old={};try{old=JSON.parse(localStorage.getItem(OLD)||"{}")}catch(e){}
defaults.forEach(function(x,i){if(old.stories&&old.stories[i+1]==="done")x.done=true});
var state;try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
if(!state||!Array.isArray(state.plans)){state={active:"starter",plans:[{id:"starter",name:"100 дней в кадре",items:defaults}],created:Date.now()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast("Не удалось сохранить. Проверь память телефона.");return false}}
function active(){return state.plans.find(function(p){return p.id===state.active})||state.plans[0]}
function tasks(){return active().items}
function completed(){return tasks().filter(function(t){return t.done}).length}
function pct(){return tasks().length?Math.round(completed()/tasks().length*100):0}
function safe(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(x){var el=document.getElementById("toaster");el.innerHTML='<div class="toast">'+safe(x)+'</div>';clearTimeout(window.vkToast);window.vkToast=setTimeout(function(){el.innerHTML=""},2600)}
function nav(){var items=[["home","⌂","Главная"],["plan","▦","Мой план"],["import","＋","Добавить"],["settings","⚙","Настройки"]];["desktopnav","mobilenav"].forEach(function(id){document.getElementById(id).innerHTML=items.map(function(x){return '<button data-nav="'+x[0]+'" class="'+(current===x[0]?"active":"")+'"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join("")})}
function taskHTML(t,i){return '<article class="task '+(t.done?"done":"")+'"><button class="tick" data-toggle="'+safe(t.id)+'" aria-label="'+(t.done?"Вернуть в работу":"Отметить выполненным")+'">✓</button><div class="taskbody"><div class="taskmeta"><span>ДЕНЬ '+(i+1)+'</span> <span class="chip">'+(t.done?"Готово ✓":"В планах")+'</span></div><div class="tasktitle">'+safe(t.title)+'</div>'+(t.desc?'<div class="taskdesc">'+safe(t.desc)+'</div>':'')+'</div><button class="iconbtn" data-edit="'+safe(t.id)+'" aria-label="Редактировать">✎</button></article>'}
function hero(){return '<section class="hero"><div><div class="eyebrow">Творчество без давления</div><h1>Каждый день —<br>новая история ✨</h1><p>Загружай свой контент-план, снимай сторис, отмечай готовое и радуйся каждому шагу.</p></div><div class="hero-art">📸</div></section>'}
function stats(){return '<div class="stats"><div class="stat"><small>Всего идей</small><strong>'+tasks().length+'</strong><em>в плане</em></div><div class="stat"><small>Сделано</small><strong>'+completed()+'</strong><em>отличная работа!</em></div><div class="stat"><small>Прогресс</small><strong>'+pct()+'%</strong><em>к цели</em></div></div>'}
function progress(){return '<div class="progress-card"><div class="progress-label"><span>Твой путь 💖</span><b>'+completed()+' / '+tasks().length+'</b></div><div class="track" role="progressbar" aria-valuenow="'+pct()+'" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:'+pct()+'%"></div></div><p class="small-muted" style="margin:11px 0 0">Не нужно идеально. Главное — продолжать!</p></div>'}
function home(){var next=tasks().map(function(t,i){return{t:t,i:i}}).filter(function(x){return !x.t.done}).slice(0,3);return hero()+stats()+progress()+'<section class="section"><div class="sectionhead"><h2>Следующие идеи</h2><button class="btn soft" data-nav="plan">Весь план →</button></div><div class="list">'+(next.length?next.map(function(x){return taskHTML(x.t,x.i)}).join(""):'<div class="empty"><b>Все задания выполнены! 🎉</b>Ты молодец. Добавь следующий план.</div>')+'</div></section><section class="section"><div class="panel"><h2>Твой собственный контент-план</h2><p class="small-muted">Можно скопировать список из заметок, Telegram, ChatGPT или таблицы и вставить сюда. Каждая строка станет отдельным заданием.</p><button class="btn primary" data-nav="import">＋ Вставить контент-план</button></div></section>'}
function plan(){var visible=tasks().map(function(t,i){return{t:t,i:i}}).filter(function(x){return(filter==="all"||(filter==="done"?x.t.done:!x.t.done))&&(!query||(x.t.title+" "+(x.t.desc||"")).toLowerCase().includes(query.toLowerCase()))});return '<div class="sectionhead"><div><div class="eyebrow">Твои идеи</div><h1 style="margin:6px 0 0;font-size:31px;letter-spacing:-1px">'+safe(active().name)+'</h1></div><button class="btn primary" data-nav="import">＋ Добавить</button></div>'+stats()+'<div class="toolbar"><input id="search" class="field" placeholder="Поиск по темам…" value="'+safe(query)+'"><select class="field" id="plan-select">'+state.plans.map(function(p){return '<option value="'+safe(p.id)+'" '+(p.id===state.active?"selected":"")+'>'+safe(p.name)+'</option>'}).join("")+'</select></div><div class="subnav" style="margin-bottom:17px"><button data-filter="all" class="'+(filter==="all"?"active":"")+'">Все ('+tasks().length+')</button><button data-filter="todo" class="'+(filter==="todo"?"active":"")+'">В планах</button><button data-filter="done" class="'+(filter==="done"?"active":"")+'">Готово ('+completed()+')</button></div><div class="list" id="tasks-list">'+(visible.length?visible.map(function(x){return taskHTML(x.t,x.i)}).join(""):'<div class="empty"><b>Здесь пока пусто</b>Измени поиск или добавь контент-план.</div>')+'</div>'}
function importPage(){return '<div class="eyebrow">Добавляй своё</div><h1 style="font-size:32px;margin:8px 0 9px;letter-spacing:-1px">Импорт контент-плана ✨</h1><p class="small-muted">Просто скопируй план из ChatGPT, мессенджера или заметок и вставь в поле ниже.</p><div class="panel" style="margin-top:22px"><label for="import-text" style="display:block;font-weight:800;margin-bottom:10px">Твои будущие сторис</label><textarea id="import-text" class="field" style="width:100%;min-height:235px;resize:vertical;line-height:1.7" placeholder="День 1. Расскажи, почему начал снимать сторис&#10;День 2. Покажи свой обычный день&#10;День 3. Ответь на вопрос подписчика"></textarea><p class="hint">Поддерживаются строки «День 1. Тема», «1. Тема», списки с • или — и просто темы с новой строки. Пустые строки пропускаются. Если нужен сценарий с абзацами — добавь его в редакторе задания.</p><div style="display:grid;gap:10px"><label style="font-size:13px;font-weight:800" for="import-mode">Как добавить?</label><select id="import-mode" class="field"><option value="new">Создать отдельный план</option><option value="append">Добавить к текущему плану</option><option value="replace">Заменить текущий план (с удалением его отметок)</option></select><input id="new-name" class="field" maxlength="80" placeholder="Название нового плана (например, Мои 30 Reels)" value="Мой контент-план"><button id="do-import" class="btn primary" style="width:100%">✨ Импортировать задания</button></div></div><div class="panel" style="margin-top:16px"><h3>Хочешь придумать план с нуля?</h3><p class="small-muted">Создай пустой план и добавляй идеи вручную.</p><button id="new-empty" class="btn secondary">Создать пустой план</button></div>'}
function settings(){return '<div class="eyebrow">Все под контролем</div><h1 style="font-size:32px;margin:9px 0 22px">Настройки ⚙</h1><div class="panel"><h3>Мои планы</h3><p class="small-muted">Каждый план и его отметки независимы.</p><div id="plans-manage">'+state.plans.map(function(p){return '<div class="settings-row"><div><b>'+safe(p.name)+'</b><p>'+p.items.length+' заданий · '+p.items.filter(function(x){return x.done}).length+' выполнено</p></div><div class="actions"><button class="btn soft" data-switch="'+safe(p.id)+'">Открыть</button><button class="btn secondary" data-remove="'+safe(p.id)+'" aria-label="Удалить план">🗑</button></div></div>'}).join("")+'</div></div><div class="panel" style="margin-top:18px"><h3>Резервная копия</h3><p class="small-muted">Данные сохраняются локально на этом устройстве, а не в аккаунте. Экспортируй файл JSON, чтобы перенести планы и отметки на другой телефон.</p><div class="actions"><button id="export" class="btn primary">↓ Скачать копию JSON</button><button id="restore" class="btn secondary">↑ Восстановить из JSON</button><input type="file" id="restorefile" accept=".json,application/json" hidden></div></div><div class="panel" style="margin-top:18px"><h3>Как установить на телефон?</h3><p class="small-muted"><b>iPhone:</b> открой сайт в Safari → «Поделиться» → «На экран Домой».<br><b>Android:</b> открой в Chrome → меню ⋮ → «Установить приложение» или «Добавить на главный экран».</p><button id="install-btn" class="btn secondary">Установить, если доступно</button></div><p class="small-muted" style="margin-top:20px">Без регистрации, аналитики и загрузки личных данных на сервер. Очистка данных браузера или удаление приложения могут удалить прогресс.</p>'}
function render(){nav();document.getElementById("content").innerHTML=({home:home,plan:plan,import:importPage,settings:settings}[current]||home)();if(current==="plan"){var s=document.getElementById("search");s.addEventListener("input",function(){query=s.value;var pos=s.selectionStart;document.getElementById("tasks-list").innerHTML=tasks().map(function(t,i){return{t:t,i:i}}).filter(function(x){return(filter==="all"||(filter==="done"?x.t.done:!x.t.done))&&(!query||(x.t.title+" "+(x.t.desc||"")).toLowerCase().includes(query.toLowerCase()))}).map(function(x){return taskHTML(x.t,x.i)}).join("")||'<div class="empty">Ничего не найдено</div>';s.focus();s.setSelectionRange(pos,pos)})}}
function go(p){if(p==="import"&&current!=="import"){}current=p;window.scrollTo(0,0);render()}
function parse(raw){var lines=raw.replace(/\r/g,"").split("\n").map(function(s){return s.trim()}).filter(Boolean);return lines.map(function(line){return line.replace(/^(?:день|day)\s*\d+\s*[:.)—–-]?\s*/i,"").replace(/^\d{1,4}\s*[.):—–-]\s*/,"").replace(/^[•●▪\-–—*]\s*/,"").trim()}).filter(Boolean).slice(0,1000).map(function(title){return{id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,9),title:title.slice(0,500),desc:"",done:false}})}
function makePlan(name,items){var id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);state.plans.push({id:id,name:name.trim()||"Мой контент-план",items:items});state.active=id}
function showEdit(id){var t=tasks().find(function(x){return x.id===id});if(!t)return;editId=id;document.getElementById("overlay").innerHTML='<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-heading"><div class="modal-head"><h2 id="edit-heading">Редактор идеи ✏️</h2><button data-close aria-label="Закрыть">×</button></div><label class="small-muted" for="edit-title">Название</label><input id="edit-title" class="field" maxlength="500" value="'+safe(t.title)+'"><label class="small-muted" for="edit-desc">Сценарий, мысли, текст</label><textarea id="edit-desc" class="field" placeholder="Что сказать или снять?">'+safe(t.desc||"")+'</textarea><div class="actions" style="justify-content:space-between;margin-top:17px"><button id="delete-task" class="btn secondary">Удалить идею</button><button id="save-task" class="btn primary">Сохранить</button></div></div></div>';document.getElementById("edit-title").focus()}
function closeModal(){document.getElementById("overlay").innerHTML="";editId=null}
var pendingInstall=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();pendingInstall=e});
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.nav){go(b.dataset.nav);return}
if(b.dataset.toggle){var t=tasks().find(function(x){return x.id===b.dataset.toggle});if(t){t.done=!t.done;save();render();toast(t.done?"Готово! Ты молодец 💖":"Вернули в работу")};return}
if(b.dataset.edit){showEdit(b.dataset.edit);return}
if(b.dataset.filter){filter=b.dataset.filter;render();return}
if(b.dataset.switch){state.active=b.dataset.switch;save();go("plan");return}
if(b.dataset.remove){if(state.plans.length===1){toast("Нужен хотя бы один план");return}var p=state.plans.find(function(x){return x.id===b.dataset.remove});if(p&&confirm('Удалить план «'+p.name+'» со всеми отметками?')){state.plans=state.plans.filter(function(x){return x.id!==p.id});if(state.active===p.id)state.active=state.plans[0].id;save();render()}return}
if(b.id==="do-import"){var text=document.getElementById("import-text").value,arr=parse(text),mode=document.getElementById("import-mode").value,name=document.getElementById("new-name").value;if(!arr.length){toast("Сначала вставь хотя бы одну тему");return}if(mode==="new")makePlan(name,arr);else if(mode==="append")active().items.push.apply(active().items,arr);else{if(!confirm("Текущий план и его отметки будут заменены. Продолжить?"))return;active().items=arr}if(save()){filter="all";query="";go("plan");toast("Добавлено идей: "+arr.length)}return}
if(b.id==="new-empty"){var name=prompt("Как назвать новый план?","Мой новый план");if(name!==null){makePlan(name,[]);save();go("plan");toast("План создан. Добавь первую идею через импорт.")}return}
if(b.id==="save-task"){var title=document.getElementById("edit-title").value.trim();if(!title){toast("Название не может быть пустым");return}var t=tasks().find(function(x){return x.id===editId});if(t){t.title=title;t.desc=document.getElementById("edit-desc").value;save();closeModal();render();toast("Изменения сохранены")}return}
if(b.id==="delete-task"){if(confirm("Удалить это задание?")){active().items=tasks().filter(function(t){return t.id!==editId});save();closeModal();render()}return}
if(b.hasAttribute("data-close")){closeModal();return}
if(b.id==="export"){var blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),state:state},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="vkadre-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);toast("Резервная копия готова");return}
if(b.id==="restore"){document.getElementById("restorefile").click();return}
if(b.id==="install-btn"){if(pendingInstall){pendingInstall.prompt();pendingInstall=null}else toast("Используй меню браузера → На главный экран");return}
});
document.addEventListener("change",function(e){if(e.target.id==="plan-select"){state.active=e.target.value;save();render()}if(e.target.id==="import-mode"){document.getElementById("new-name").style.display=e.target.value==="new"?"block":"none"}if(e.target.id==="restorefile"){var f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>5e6){toast("Файл слишком большой");return}f.text().then(function(raw){var o=JSON.parse(raw),v=o.state||o;if(!Array.isArray(v.plans)||!v.plans.length||v.plans.some(function(p){return !Array.isArray(p.items)||typeof p.name!=="string"||typeof p.id!=="string"||p.items.length>5000}))throw Error("format");if(!confirm("Заменить все текущие планы и прогресс данными из файла?"))return;state={active:v.active,plans:v.plans.map(function(p){return{id:p.id,name:p.name.slice(0,80),items:p.items.map(function(t){return{id:String(t.id),title:String(t.title||"").slice(0,500),desc:String(t.desc||"").slice(0,10000),done:!!t.done}})}})};if(!state.plans.some(function(p){return p.id===state.active}))state.active=state.plans[0].id;save();go("settings");toast("Данные восстановлены")}).catch(function(){toast("Неверный формат резервной копии")})}});
document.addEventListener("click",function(e){if(e.target.classList.contains("modal-back"))closeModal()});
if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
render();
})();
</script></body></html>
