/* Promo-matched dashboard */
body{background:#fff9fc}
.main{max-width:1050px;width:100%;margin:0 auto}
.topline{background:#fff;border-radius:20px;padding:14px 18px;border:1px solid #f4e7ef;box-shadow:0 8px 22px #4f203509}

.topline .avatar{height:39px;width:39px;border:0;padding:0;background:#fff1f9;color:#b95192}
.topline .avatar div{background:#fff1f9;color:#bc528f}
.dash{display:grid;gap:17px}
.dash-heading{font-size:19px;letter-spacing:-.5px;margin:0}
.dash-card{background:white;border:1px solid #efe3ed;border-radius:23px;padding:22px;box-shadow:0 10px 27px #4a173208}
.dash-progress{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:16px;align-items:center}
.dash-progress h2{font-size:21px;margin:0 0 7px}
.dash-progress p{font-size:13px;color:#817584;margin:0 0 16px}
.dash-ring{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#e842a5 var(--progress),#f2e7f0 0);transform:rotate(-90deg)}
.dash-ring:before{content:"";grid-area:1/1;width:73px;height:73px;background:white;border-radius:50%}
.dash-ring span{grid-area:1/1;position:relative;font-size:22px;font-weight:900;letter-spacing:-.7px;transform:rotate(90deg)}
.dash-track{height:10px;background:#f1e7ee;border-radius:20px;overflow:hidden}
.dash-track span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#fa62a2,#bd4af2);transition:width .25s}
.dash-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:15px}
.dash-day{border:1px solid #f2e7ee;border-radius:13px;padding:12px 3px;min-width:0;background:#fffbfd;text-align:center;display:grid;gap:6px;justify-items:center}
.dash-day small{font-size:11px;font-weight:750;color:#9a8595}

.dash-day i{width:5px;height:5px;border-radius:50%;background:#e9dfe8}
.dash-day.has i{background:#ed4b9f}
.dash-day.today{background:#fff0f8;border-color:#f3a9cf}
.dash-day.today strong{color:white;background:#e83a93;width:31px;height:31px;display:grid;place-items:center;border-radius:50%;margin:-6px 0}
.dash-upcoming{display:grid;gap:8px}
.dash-task{display:flex;align-items:center;gap:12px;border:1px solid #f4eaf0;background:white;border-radius:15px;padding:12px}
.dash-task .tick{border-radius:9px;width:29px;height:29px;flex-basis:29px;font-size:15px}
.dash-task .dash-task-body{min-width:0;flex:1}
.dash-task .dash-task-body b{font-size:13px;line-height:1.45;display:block;overflow-wrap:anywhere}
.dash-task .dash-task-body small{font-size:11px;color:#a18197;margin-top:3px;display:block}
.dash-task.done .dash-task-body b{text-decoration:line-through;color:#a39da5}
.dash-task.done .tick{background:#e94698;border-color:#e94698;color:#fff}
.dash-task .dash-date{font-size:11px;white-space:nowrap;color:#ad5a8d;background:#fff0f7;padding:6px 9px;border-radius:10px}
.dash-task .iconbtn{background:#fff7fa}
.dash-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.dash-tile{text-align:left;padding:15px 14px;border:1px solid #f1e5ee;border-radius:18px;background:white;box-shadow:0 9px 18px #4a173206;display:grid;gap:8px;min-width:0}
.dash-tile .tile-icon{color:#ee449b;font-size:24px}
.dash-tile b{font-size:13px}
.dash-tile small{font-size:11px;color:#8e7989}
.dash-card .sectionhead{margin-bottom:12px}
.dash-card .sectionhead .btn{font-size:12px;padding:8px 12px}
.dash-onboard{border:1px dashed #edb8d1;border-radius:18px;padding:22px;text-align:center;background:#fff8fc}
.dash-onboard strong{font-size:17px;display:block;margin-bottom:8px}

.dash-onboard .actions{justify-content:center}
@media(max-width:830px){

.dash-day.today strong{width:27px;height:27px}
.dash-tiles{gap:7px}
.dash-tile{padding:12px 9px;border-radius:15px}.dash-tile b{font-size:12px}
.dash-task{padding:11px 9px;gap:8px}
.dash-task .dash-task-body b{font-size:12px}
.dash-task .dash-date{font-size:10px;padding:5px}
}

(function(){

var KEY="vkadre_v2",OLD="gornostaev100_v1",current="home",filter="all",query="",editId=null;
var old={};try{old=JSON.parse(localStorage.getItem(OLD)||"{}")}catch(e){}

 if(legacy){
  var previous=(window.CHALLENGE_DATA&&window.CHALLENGE_DATA.stories||[]).map(function(t,i){var status=old.stories&&old.stories[i+1];return{id:"d"+(i+1),title:t.title,desc:[t.hook,t.talk,t.ending].filter(Boolean).join("\\n\\n"),done:status==="done"||(status&&status.status==="done"),category:t.category||"life"}});

 }

function safe(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function nav(){var glyphs={"home":"<svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.85\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/></svg>","plan":"<svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.85\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"3\"/><path d=\"M8 9h8M8 13h8M8 17h5\"/></svg>","import":"<svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.85\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/></svg>","calendar":"<svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.85\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"3\"/><path d=\"M7 3v4M17 3v4M3 10h18\"/></svg>","stats":"<svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.85\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 19V12M10 19V7M16 19V10M22 19V4\"/></svg>"};var items=[["home","Главная"],["plan","План"],["import","Создать"],["calendar","Календарь"],["stats","Прогресс"]];["desktopnav","mobilenav"].forEach(function(id){document.getElementById(id).innerHTML=items.map(function(x){return '<button data-nav="'+x[0]+'" aria-label="'+x[1]+'" aria-current="'+(current===x[0]?"page":"false")+'" class="tab-'+x[0]+' '+(current===x[0]?"active":"")+'"><span class="tab-icon">'+glyphs[x[0]]+'</span><span class="tab-label">'+x[1]+'</span></button>'}).join("")})}
function taskHTML(t,i){return '<article class="task '+(t.done?"done":"")+'"><button class="tick" data-toggle="'+safe(t.id)+'" aria-label="'+(t.done?"Вернуть в работу":"Отметить выполненным")+'">✓</button><div class="taskbody"><div class="taskmeta"><span>ДЕНЬ '+(i+1)+'</span> <span class="chip">'+(t.done?"Готово ✓":"В планах")+'</span></div><div class="tasktitle">'+safe(t.title)+'</div>'+(t.desc?'<div class="taskdesc">'+safe(t.desc)+'</div>':'')+'</div><button class="iconbtn" data-edit="'+safe(t.id)+'" aria-label="Редактировать">✎</button></article>'}

function stats(){return '<div class="stats"><div class="stat"><small>Всего идей</small><strong>'+tasks().length+'</strong><em>в плане</em></div><div class="stat"><small>Сделано</small><strong>'+completed()+'</strong><em>отличная работа!</em></div><div class="stat"><small>Прогресс</small><strong>'+pct()+'%</strong><em>к цели</em></div></div>'}
function progress(){return '<div class="progress-card"><div class="progress-label"><span>Твой путь 💖</span><b>'+completed()+' / '+tasks().length+'</b></div><div class="track" role="progressbar" aria-valuenow="'+pct()+'" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:'+pct()+'%"></div></div></div>'}
function dashDate(t){if(!t.date)return "Без даты";var d=new Date(t.date+"T12:00:00"),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),delta=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-today)/86400000);if(delta===0)return "Сегодня";if(delta===1)return "Завтра";return d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}
function homeWeek(){var now=new Date(), monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()),w=(monday.getDay()+6)%7;monday.setDate(monday.getDate()-w);var weekdays=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],out="";for(var i=0;i<7;i++){var d=new Date(monday);d.setDate(monday.getDate()+i);var str=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),has=tasks().some(function(t){return t.date===str});out+='<button class="dash-day '+(i===w?"today ":"")+(has?"has":"")+'" data-nav="calendar" aria-label="'+str+'"><small>'+weekdays[i]+'</small><strong>'+d.getDate()+'</strong><i></i></button>'}return out}
function dashTask(t){return '<div class="dash-task '+(t.done?"done":"")+'"><button class="tick" data-toggle="'+safe(t.id)+'" aria-label="'+(t.done?"Вернуть в работу":"Отметить выполненным")+'">✓</button><div class="dash-task-body"><b>'+safe(t.title)+'</b><small>'+(t.media?"📎 Есть вложение":"Сторис / Reels / публикация")+'</small></div><span class="dash-date">'+dashDate(t)+'</span><button class="iconbtn" data-edit="'+safe(t.id)+'" aria-label="Редактировать">✎</button></div>'}
function home(){var all=tasks(),next=all.slice().sort(function(a,b){if(a.done!==b.done)return a.done?1:-1;if(!a.date&&!b.date)return 0;if(!a.date)return 1;if(!b.date)return -1;return a.date.localeCompare(b.date)}).slice(0,4),p=pct();
return '<div class="dash">'+
'<div class="dash-card"><div class="dash-progress"><div><h2>Прогресс контент-плана</h2><p>'+completed()+' из '+all.length+' идей выполнено</p><div class="dash-track" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+p+'%"></span></div></div><div class="dash-ring" style="--progress:'+p+'%"><span>'+p+'%</span></div></div></div>'+
'<div class="dash-card"><div class="sectionhead"><h2 class="dash-heading">Контент-план</h2><button class="btn soft" data-nav="calendar">Весь месяц ›</button></div><div class="small-muted">'+new Date().toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+'</div><div class="dash-week">'+homeWeek()+'</div></div>'+
'<div class="dash-card"><div class="sectionhead"><h2 class="dash-heading">Ближайшие публикации</h2><button class="btn soft" data-nav="plan">Все задачи ›</button></div>'+
(all.length?'<div class="dash-upcoming">'+next.map(dashTask).join("")+'</div>':'<div class="dash-onboard"><strong>Твой контент-план пока пуст ✨</strong><p>Вставь свои идеи из ChatGPT или заметок — и начинай отмечать выполненное.</p><div class="actions"><button class="btn primary" data-nav="import">＋ Вставить контент-план</button><button class="btn secondary" id="add-one">Добавить идею</button></div></div>')+'</div>'+
'<div class="dash-tiles"><button class="dash-tile" data-nav="plan"><span class="tile-icon">☼</span><b>Идеи</b><small>'+all.length+' в плане ↗</small></button><button class="dash-tile" data-nav="calendar"><span class="tile-icon">▦</span><b>Календарь</b><small>Публикации ↗</small></button><button class="dash-tile" data-nav="stats"><span class="tile-icon">↗</span><b>Прогресс</b><small>'+p+'% выполнено ↗</small></button></div>'+
'</div>'}
function statsPage(){return '<div class="eyebrow">Твои результаты</div><h1 style="margin:9px 0 20px">Прогресс 📈</h1>'+stats()+progress()+'<section class="section"><div class="panel"><h3>Результаты плана</h3><p class="small-muted">Выполнено '+completed()+' из '+tasks().length+' идей. Продолжай отмечать опубликованные материалы — статистика обновляется автоматически.</p><button class="btn primary" data-nav="plan">Перейти к заданиям</button></div></section>'}
function plan(){var visible=tasks().map(function(t,i){return{t:t,i:i}}).filter(function(x){return(filter==="all"||(filter==="done"?x.t.done:!x.t.done))&&(!query||(x.t.title+" "+(x.t.desc||"")).toLowerCase().includes(query.toLowerCase()))});return '<div class="sectionhead"><div><div class="eyebrow">Твои идеи</div><h1 style="margin:6px 0 0;font-size:31px;letter-spacing:-1px">'+safe(active().name)+'</h1></div><button class="btn primary" id="add-one">＋ Идея</button><button class="btn secondary" data-nav="import">Вставить план</button></div>'+stats()+'<div class="toolbar"><input id="search" class="field" placeholder="Поиск по темам…" value="'+safe(query)+'"><select class="field" id="plan-select">'+state.plans.map(function(p){return '<option value="'+safe(p.id)+'" '+(p.id===state.active?"selected":"")+'>'+safe(p.name)+'</option>'}).join("")+'</select></div><div class="subnav" style="margin-bottom:17px"><button data-filter="all" class="'+(filter==="all"?"active":"")+'">Все ('+tasks().length+')</button><button data-filter="todo" class="'+(filter==="todo"?"active":"")+'">В планах</button><button data-filter="done" class="'+(filter==="done"?"active":"")+'">Готово ('+completed()+')</button></div><div class="list" id="tasks-list">'+(visible.length?visible.map(function(x){return taskHTML(x.t,x.i)}).join(""):'<div class="empty"><b>Здесь пока пусто</b>Измени поиск или добавь контент-план.</div>')+'</div>'}
function calendarPage(){return window.VKCalendar?window.VKCalendar.render():''}
function importPage(){return '<div class="eyebrow">Добавляй своё</div><h1 style="font-size:32px;margin:8px 0 9px;letter-spacing:-1px">Импорт контент-плана ✨</h1><p class="small-muted">Просто скопируй план из ChatGPT, мессенджера или заметок и вставь в поле ниже.</p><div class="panel" style="margin-top:22px"><label for="import-text" style="display:block;font-weight:800;margin-bottom:10px">Твои будущие сторис</label><textarea id="import-text" class="field" style="width:100%;min-height:235px;resize:vertical;line-height:1.7" placeholder="День 1. Расскажи, почему начал снимать сторис&#10;День 2. Покажи свой обычный день&#10;День 3. Ответь на вопрос подписчика"></textarea><p class="hint">Поддерживаются строки «День 1. Тема», «1. Тема», списки с • или — и просто темы с новой строки. Пустые строки пропускаются. Если нужен сценарий с абзацами — добавь его в редакторе задания.</p><div style="display:grid;gap:10px"><label style="font-size:13px;font-weight:800" for="import-mode">Как добавить?</label><select id="import-mode" class="field"><option value="new">Создать отдельный план</option><option value="append">Добавить к текущему плану</option><option value="replace">Заменить текущий план (с удалением его отметок)</option></select><input id="new-name" class="field" maxlength="80" placeholder="Название нового плана (например, Мои 30 Reels)" value="Мой контент-план"><button id="do-import" class="btn primary" style="width:100%">✨ Импортировать задания</button></div></div><div class="panel" style="margin-top:16px"><h3>Хочешь придумать план с нуля?</h3><p class="small-muted">Создай пустой план и добавляй идеи вручную.</p><button id="new-empty" class="btn secondary">Создать пустой план</button></div>'}
function settings(){return '<div class="eyebrow">Все под контролем</div><h1 style="font-size:32px;margin:9px 0 22px">Настройки ⚙</h1><div class="panel"><h3>Мои планы</h3><p class="small-muted">Каждый план и его отметки независимы.</p><div id="plans-manage">'+state.plans.map(function(p){return '<div class="settings-row"><div><b>'+safe(p.name)+'</b><p>'+p.items.length+' заданий · '+p.items.filter(function(x){return x.done}).length+' выполнено</p></div><div class="actions"><button class="btn soft" data-switch="'+safe(p.id)+'">Открыть</button><button class="btn secondary" data-remove="'+safe(p.id)+'" aria-label="Удалить план">🗑</button></div></div>'}).join("")+'</div></div><div class="panel" style="margin-top:18px"><h3>Резервная копия</h3><p class="small-muted">Данные сохраняются локально на этом устройстве, а не в аккаунте. JSON переносит планы, даты и отметки, но не сами фото и видео. Медиафайлы сохраняй отдельно.</p><div class="actions"><button id="export" class="btn primary">↓ Скачать копию JSON</button><button id="restore" class="btn secondary">↑ Восстановить из JSON</button><input type="file" id="restorefile" accept=".json,application/json" hidden></div></div><div class="panel" style="margin-top:18px"><h3>Как установить на телефон?</h3><p class="small-muted"><b>iPhone:</b> открой сайт в Safari → «Поделиться» → «На экран Домой».<br><b>Android:</b> открой в Chrome → меню ⋮ → «Установить приложение» или «Добавить на главный экран».</p><button id="install-btn" class="btn secondary">Установить, если доступно</button></div><p class="small-muted" style="margin-top:20px">Без регистрации, аналитики и загрузки личных данных на сервер. Очистка данных браузера или удаление приложения могут удалить прогресс.</p>'}
function render(){nav();document.getElementById("content").innerHTML=({home:home,plan:plan,calendar:calendarPage,import:importPage,stats:statsPage,settings:settings}[current]||home)();if(current==="plan"){var s=document.getElementById("search");s.addEventListener("input",function(){query=s.value;var pos=s.selectionStart;document.getElementById("tasks-list").innerHTML=tasks().map(function(t,i){return{t:t,i:i}}).filter(function(x){return(filter==="all"||(filter==="done"?x.t.done:!x.t.done))&&(!query||(x.t.title+" "+(x.t.desc||"")).toLowerCase().includes(query.toLowerCase()))}).map(function(x){return taskHTML(x.t,x.i)}).join("")||'<div class="empty">Ничего не найдено</div>';s.focus();s.setSelectionRange(pos,pos)})}}
function go(p){if(p==="import"&&current!=="import"){}current=p;window.scrollTo(0,0);render()}
function parse(raw){var lines=raw.replace(/\r/g,"").split("\n").map(function(s){return s.trim()}).filter(Boolean);return lines.map(function(line){return line.replace(/^(?:день|day)\s*\d+\s*[:.)—–-]?\s*/i,"").replace(/^\d{1,4}\s*[.):—–-]\s*/,"").replace(/^[•●▪\-–—*]\s*/,"").trim()}).filter(Boolean).slice(0,1000).map(function(title){return{id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,9),title:title.slice(0,500),desc:"",done:false}})}
function makePlan(name,items){var id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);state.plans.push({id:id,name:name.trim()||"Мой контент-план",items:items});state.active=id}
function showEdit(id){var t=tasks().find(function(x){return x.id===id});if(!t)return;editId=id;document.getElementById("overlay").innerHTML='<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-heading"><div class="modal-head"><h2 id="edit-heading">Редактор идеи ✏️</h2><button data-close aria-label="Закрыть">×</button></div><label class="small-muted" for="edit-title">Название</label><input id="edit-title" class="field" maxlength="500" value="'+safe(t.title)+'"><label class="small-muted" for="edit-desc">Сценарий, мысли, текст</label><textarea id="edit-desc" class="field" placeholder="Что сказать или снять?">'+safe(t.desc||"")+'</textarea><div class="actions" style="justify-content:space-between;margin-top:17px"><button id="delete-task" class="btn secondary">Удалить идею</button><button id="save-task" class="btn primary">Сохранить</button></div></div></div>';document.getElementById("edit-title").focus();if(window.VKCalendar)window.VKCalendar.onEdit(id)}
function closeModal(){document.getElementById("overlay").innerHTML="";editId=null}
var pendingInstall=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();pendingInstall=e});
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(window.VKCalendar&&window.VKCalendar.onClick(b,state))return;
if(b.dataset.nav){go(b.dataset.nav);return}
if(b.dataset.toggle){var t=tasks().find(function(x){return x.id===b.dataset.toggle});if(t){t.done=!t.done;save();render();toast(t.done?"Готово! Ты молодец 💖":"Вернули в работу")};return}
if(b.dataset.edit){showEdit(b.dataset.edit);return}
if(b.dataset.filter){filter=b.dataset.filter;render();return}
if(b.dataset.switch){state.active=b.dataset.switch;save();go("plan");return}
if(b.dataset.remove){if(state.plans.length===1){toast("Нужен хотя бы один план");return}var p=state.plans.find(function(x){return x.id===b.dataset.remove});if(p&&confirm('Удалить план «'+p.name+'» со всеми отметками?')){state.plans=state.plans.filter(function(x){return x.id!==p.id});if(state.active===p.id)state.active=state.plans[0].id;save();render()}return}
if(b.id==="add-one"){var t={id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,8),title:"Новая идея",desc:"",done:false};tasks().push(t);save();showEdit(t.id);return}
if(b.id==="do-import"){var text=document.getElementById("import-text").value,arr=parse(text),mode=document.getElementById("import-mode").value,name=document.getElementById("new-name").value;if(!arr.length){toast("Сначала вставь хотя бы одну тему");return}if(mode==="new")makePlan(name,arr);else if(mode==="append")active().items.push.apply(active().items,arr);else{if(!confirm("Текущий план и его отметки будут заменены. Продолжить?"))return;active().items=arr}if(save()){filter="all";query="";go("plan");toast("Добавлено идей: "+arr.length)}return}
if(b.id==="new-empty"){var name=prompt("Как назвать новый план?","Мой новый план");if(name!==null){makePlan(name,[]);save();go("plan");toast("План создан. Добавь первую идею через импорт.")}return}
if(b.id==="save-task"){var title=document.getElementById("edit-title").value.trim();if(!title){toast("Название не может быть пустым");return}var t=tasks().find(function(x){return x.id===editId});if(t){t.title=title;t.desc=document.getElementById("edit-desc").value;if(window.VKCalendar)window.VKCalendar.saveEdit(t);save();closeModal();render();toast("Изменения сохранены")}return}
if(b.id==="delete-task"){if(confirm("Удалить это задание?")){if(window.VKCalendar)window.VKCalendar.deleteTask(editId);active().items=tasks().filter(function(t){return t.id!==editId});save();closeModal();render()}return}
if(b.hasAttribute("data-close")){closeModal();return}
if(b.id==="export"){var blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),state:state},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="vkadre-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);toast("Резервная копия готова");return}
if(b.id==="restore"){document.getElementById("restorefile").click();return}
if(b.id==="install-btn"){if(pendingInstall){pendingInstall.prompt();pendingInstall=null}else toast("Используй меню браузера → На главный экран");return}
});
document.addEventListener("change",function(e){if(window.VKCalendar&&window.VKCalendar.onChange(e,state))return;if(e.target.id==="plan-select"){state.active=e.target.value;save();render()}if(e.target.id==="import-mode"){document.getElementById("new-name").style.display=e.target.value==="new"?"block":"none"}if(e.target.id==="restorefile"){var f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>5e6){toast("Файл слишком большой");return}f.text().then(function(raw){var o=JSON.parse(raw),v=o.state||o;if(!Array.isArray(v.plans)||!v.plans.length||v.plans.some(function(p){return !Array.isArray(p.items)||typeof p.name!=="string"||typeof p.id!=="string"||p.items.length>5000}))throw Error("format");if(!confirm("Заменить все текущие планы и прогресс данными из файла?"))return;state={active:v.active,plans:v.plans.map(function(p){return{id:p.id,name:p.name.slice(0,80),items:p.items.map(function(t){return{id:String(t.id),title:String(t.title||"").slice(0,500),desc:String(t.desc||"").slice(0,10000),done:!!t.done}})}})};if(!state.plans.some(function(p){return p.id===state.active}))state.active=state.plans[0].id;save();go("settings");toast("Данные восстановлены")}).catch(function(){toast("Неверный формат резервной копии")})}});
document.addEventListener("click",function(e){if(e.target.classList.contains("modal-back"))closeModal()});
if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
render();
})();
