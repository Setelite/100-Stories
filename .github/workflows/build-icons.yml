name: Build Liquid Glass app icons
on:
  push:
    branches: [main]
    paths:
      - 'icons/vkadre-icon.svg'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render high-resolution PNG icons
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import io
          from PIL import Image
          import cairosvg
          svg = open('icons/vkadre-icon.svg', 'rb').read()
          for filename, size in [('apple-touch-icon.png', 180), ('icon-192.png', 192), ('icon-512.png', 512)]:
              data = cairosvg.svg2png(bytestring=svg, output_width=size*2, output_height=size*2)
              image = Image.open(io.BytesIO(data)).convert('RGB')
              image = image.resize((size,size), Image.Resampling.LANCZOS)
              image.save('icons/'+filename, 'PNG', optimize=True)
          PY
      - name: Commit updated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Render Liquid Glass icons for iPhone and Android"
            git push
          fi
